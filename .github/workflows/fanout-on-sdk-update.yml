name: Fan out SDK updates

# When the Rust plugin SDK lands a develop-branch commit that touches
# library code, dispatch a release build on every dependent plugin
# repo so their dev container images pick up the new SDK at the same
# develop SHA. Without this, plugin :dev tags would silently lag the
# SDK until each plugin's own release was triggered.
#
# Triggers:
#   - push to develop touching src/, Cargo.toml, or Cargo.lock
#     (skips docs-only changes that wouldn't change behavior)
#   - workflow_dispatch for ad-hoc fan-out
#
# Auth: needs SDK_FANOUT_PAT — a PAT with `actions: write` on each
# of the 11 plugin repos in the homeCore-io org. Fine-grained PAT
# preferred. See README for setup.

on:
  push:
    branches: [develop]
    paths:
      - 'src/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: fanout-sdk
  cancel-in-progress: true

jobs:
  fanout:
    name: Dispatch ${{ matrix.plugin }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        plugin:
          - hc-hue
          - hc-yolink
          - hc-lutron
          - hc-caseta
          - hc-sonos
          - hc-ecowitt
          - hc-zwave
          - hc-isy
          - hc-wled
          - hc-thermostat
    env:
      GH_TOKEN: ${{ secrets.SDK_FANOUT_PAT }}
    steps:
      - name: Pre-flight — token + plugin repo reachable
        run: |
          if [ -z "${{ secrets.SDK_FANOUT_PAT }}" ]; then
            echo "::error::SDK_FANOUT_PAT secret is not set in this repo. Add a PAT with actions:write on the 11 plugin repos."
            exit 1
          fi
          gh repo view "homeCore-io/${{ matrix.plugin }}" --json name >/dev/null

      - name: Dispatch release on plugin repo
        # refresh_deps=true is the whole point of fanout — without it the
        # plugin's release rebuilds against whatever SHA the plugin's
        # Cargo.lock already pins for plugin-sdk-rs, producing a new
        # container tag that carries the SAME old code. Setting it true
        # makes `cargo update -p plugin-sdk-rs` run inside the build
        # container so the SDK SHA we just pushed is the one that
        # actually lands in the binary. Reproducibility caveat: dev-tag
        # builds become non-deterministic between fanout runs (expected),
        # but tag-push releases keep their deterministic Cargo.lock
        # behavior because they don't go through this dispatcher.
        run: |
          set -eux
          gh workflow run release.yml \
            --repo "homeCore-io/${{ matrix.plugin }}" \
            --ref develop \
            -F fast=true \
            -F refresh_deps=true

      - name: Summary
        run: |
          {
            echo "Dispatched: homeCore-io/${{ matrix.plugin }} release.yml on develop (fast=true, refresh_deps=true)"
            echo "Triggered by: ${{ github.event_name }} / sha=${{ github.sha }}"
          } >> "$GITHUB_STEP_SUMMARY"

  # ── Each plugin's release.yml now fires a repository_dispatch at
  # homeCore-io/docker on success (see hc-scripts/rust-release.yml's
  # dispatch-appliance job). The docker workflow's concurrency group
  # coalesces the wave of 10 plugin dispatches into a single appliance
  # build, so we do NOT need to dispatch the appliance from here.
  #
  # We DO still need to dispatch homeCore release, because core uses
  # hc-types/hc-logging/hc-time (not plugin-sdk-rs) and so isn't in
  # the plugin matrix above — but hc-types lives in homeCore, and SDK
  # changes that touch shared traits typically land alongside hc-types
  # bumps. Triggering core release rebuilds hc-core:dev with the new
  # workspace state, which then cascades to appliance via dispatch-appliance.
  dispatch-core:
    name: Dispatch homeCore release
    needs: fanout
    runs-on: ubuntu-latest
    if: always() && needs.fanout.result != 'cancelled'
    env:
      GH_TOKEN: ${{ secrets.SDK_FANOUT_PAT }}
    steps:
      - name: Dispatch
        run: |
          set -eux
          gh workflow run release.yml \
            --repo homeCore-io/homeCore \
            --ref develop \
            -F fast=true
