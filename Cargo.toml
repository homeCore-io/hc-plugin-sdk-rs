[package]
name    = "plugin-sdk-rs"
version = "0.3.10"
edition = "2021"
license = "MIT OR Apache-2.0"

[dependencies]
rumqttc    = "0.25"
tokio      = { version = "1", features = ["full"] }
serde      = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow     = "1"
tracing    = "0.1"
tracing-subscriber = { version = "0.3", features = ["registry"] }
chrono     = { version = "0.4", features = ["serde"] }
toml       = "1"
hc-types   = { git = "https://github.com/homeCore-io/homeCore", branch = "main", features = ["descriptor"] }
hc-logging = { git = "https://github.com/homeCore-io/homeCore", branch = "main" }
hc-time    = { git = "https://github.com/homeCore-io/homeCore", branch = "main" }
